name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches:
      - main
  # Refresh the auto-generated Research & News feed twice daily
  # (rebuilds the site so the RSS feed is re-fetched). Times are UTC.
  schedule:
    - cron: "0 11 * * *"   # ~06:00/07:00 America/New_York
    - cron: "0 23 * * *"   # ~18:00/19:00 America/New_York
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4